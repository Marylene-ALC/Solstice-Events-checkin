<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solstice Events Check-In</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="kiosk">

        <div class="header">
            <h1>Solstice Events</h1>
            <p>Conference Check-In</p>
        </div>


        <div class="checkin-card">

            <label for="attendeeId">
                Attendee ID / QR Code
            </label>

            <input
                id="attendeeId"
                type="text"
                placeholder="Example: ATT-001"
            >

            <button onclick="checkIn()">
                Check In
            </button>

            <div id="result" class="result">
                Enter an attendee ID to begin.
            </div>

        </div>


        <div class="test-attendees">

            <h3>Test Attendees</h3>

            <p>
                <strong>ATT-001</strong>
                — Maya Chen
            </p>

            <p>
                <strong>ATT-002</strong>
                — Daniel Okafor
            </p>

            <p>
                <strong>ATT-003</strong>
                — Sofia Laurent
            </p>

        </div>

    </div>


    <script>

        async function checkIn() {

            const attendeeId =
                document
                    .getElementById("attendeeId")
                    .value
                    .trim()
                    .toUpperCase();

            const result =
                document.getElementById("result");


            if (!attendeeId) {

                result.innerHTML =
                    "Please enter an attendee ID.";

                return;
            }


            result.innerHTML =
                "Submitting print request...";


            try {

                const response = await fetch(
                    "/check-in",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            attendeeId: attendeeId
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    if (data.status === "PENDING") {

                        result.innerHTML = `
                            <strong>${data.name}</strong>

                            <br><br>

                            ⏳ PENDING

                            <br>

                            ${data.message}

                            <br><br>

                            Waiting for printer confirmation...
                        `;


                        // Start checking the attendee's
                        // latest status every 2 seconds.
                        watchStatus(
                            attendeeId,
                            data.name
                        );
                    }

                }

                else {

                    if (data.status === "PENDING") {

                        result.innerHTML = `
                            ⚠️ ${data.name}
                            already has a badge print
                            in progress.

                            <br><br>

                            Current status:
                            ${data.status}
                        `;

                    }

                    else if (data.status === "CHECKED_IN") {

                        result.innerHTML = `
                            ✅ ${data.name}
                            is already checked in.

                            <br><br>

                            No additional badge
                            was printed.
                        `;

                    }

                    else {

                        result.innerHTML = `
                            ⚠️ ${data.message}
                        `;

                    }

                }

            }

            catch (error) {

                console.error(error);

                result.innerHTML =
                    "Something went wrong while contacting the server.";

            }

        }



        // ------------------------------------------------
        // WATCH ATTENDEE STATUS
        // ------------------------------------------------

        async function watchStatus(attendeeId, attendeeName) {

            const result =
                document.getElementById("result");


            const timer = setInterval(
                async function () {

                    try {

                        const response = await fetch(
                            `/attendees/${attendeeId}`
                        );


                        const attendee =
                            await response.json();


                        if (
                            attendee.status ===
                            "CHECKED_IN"
                        ) {

                            clearInterval(timer);


                            result.innerHTML = `
                                <strong>
                                    ${attendeeName}
                                </strong>

                                <br><br>

                                ✅ CHECKED IN

                                <br>

                                Badge printed successfully.
                            `;

                        }

                    }

                    catch (error) {

                        console.error(
                            "Status check failed:",
                            error
                        );

                    }

                },

                2000
            );

        }

    </script>

</body>

</html>
