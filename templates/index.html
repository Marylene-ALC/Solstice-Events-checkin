<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solstice Events Check-In</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>


<body>

    <div class="kiosk">

        <div class="header">
            <h1>Solstice Events</h1>
            <p>Conference Check-In</p>
        </div>


        <div class="checkin-card">

            <label for="attendeeId">
                Attendee ID
            </label>

       <input
                id="attendeeId"
                type="text"
                placeholder="Example: ATT-001"
            >

            <button onclick="checkIn()">
                Check In
            </button>

            <div id="result" class="result">
                Enter an attendee ID to begin.
            </div>

        </div>


        <div class="test-attendees">

            <h3>Test Attendees</h3>

            <p>
                <strong>ATT-001</strong>
                — Maya Chen
            </p>

            <p>
                <strong>ATT-002</strong>
                — Daniel Okafor
            </p>

            <p>
                <strong>ATT-003</strong>
                — Sofia Laurent
            </p>

        </div>

    </div>

   <script>

        async function checkIn() {

            const attendeeId =
                document
                    .getElementById("attendeeId")
                    .value
                    .trim()
                    .toUpperCase();


            const result =
                document.getElementById("result");


            if (!attendeeId) {

                result.innerHTML =
                    "Please enter an attendee ID.";

                return;
            }


            result.innerHTML =
                "Submitting print request...";


            try {

                const response = await fetch(
                    "/check-in",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            attendeeId: attendeeId
                        })
                    }
                );


                const data = await response.json();


                // ------------------------------------------
                // NEW CHECK-IN
                // ------------------------------------------

                if (response.ok) {

                    if (data.status === "PENDING") {

                        showAttendeeResult(
                            data.name,
                            attendeeId,
                            "PENDING",
                            data.message
                        );


                        watchStatus(
                            attendeeId,
                            data.name
                        );

                    }

                }


                // ------------------------------------------
                // DUPLICATE / ERROR
                // ------------------------------------------

                else {

                    if (data.status === "PENDING") {

                        showAttendeeResult(
                            data.name,
                            attendeeId,
                            "PENDING",
                            "Badge printing is already in progress."
                        );

                    }


                    else if (data.status === "CHECKED_IN") {

                        showAttendeeResult(
                            data.name,
                            attendeeId,
                            "CHECKED_IN",
                            "This attendee is already checked in. No additional badge was printed."
                        );

                    }


                    else {

                        result.innerHTML = `
                            ⚠️ ${data.message}
                        `;

                    }

                }

            }


            catch (error) {

                console.error(error);

                result.innerHTML =
                    "Something went wrong while contacting the server.";

            }

        }



        // ==================================================
        // DISPLAY ATTENDEE + QR CODE
        // ==================================================

        function showAttendeeResult(
            attendeeName,
            attendeeId,
            status,
            message
        ) {

            const result =
                document.getElementById("result");


            let statusText = "";


            if (status === "PENDING") {

                statusText = `
                    ⏳ PENDING
                `;

            }


            else if (status === "CHECKED_IN") {

                statusText = `
                    ✅ CHECKED IN
                `;

            }


            result.innerHTML = `

                <strong class="attendee-name">
                    ${attendeeName}
                </strong>

                <br><br>

                <div
                    id="attendeeQr"
                    class="attendee-qr"
                ></div>

                <p class="attendee-code">
                    ${attendeeId}
                </p>

                <strong>
                    ${statusText}
                </strong>

                <br><br>

                ${message}
            `;


            // Generate this attendee's QR code
            new QRCode(
                document.getElementById("attendeeQr"),
                {
                    text: attendeeId,
                    width: 130,
                    height: 130
                }
            );

        }



        // ==================================================
        // WATCH STATUS
        // ==================================================

        async function watchStatus(
            attendeeId,
            attendeeName
  ) {

            const timer = setInterval(

                async function () {

                    try {

                        const response = await fetch(
                            `/attendees/${attendeeId}`
                        );


                        const attendee =
                            await response.json();


                        if (
                            attendee.status ===
                            "CHECKED_IN"
                        ) {

                            clearInterval(timer);


                            showAttendeeResult(
                                attendeeName,
                                attendeeId,
                                "CHECKED_IN",
                                "Badge printed successfully."
                            );

                        }

                    }


                    catch (error) {

                        console.error(
                            "Status check failed:",
                            error
                        );

                    }

                },

                2000
            );

        }

</script>

</body>

</html>
